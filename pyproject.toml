[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-churn-toolkit"
version = "0.2.0"
description = "A lightweight user_id-based GA4 purchase churn toolkit with pre-churn analysis for BigQuery and Google Colab."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "google-cloud-bigquery>=3.20,<4"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ga4_churn = ["sql/*.sql"]
